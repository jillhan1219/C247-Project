# @package _global_
module:
  _target_: emg2qwerty.lightning.TDSConvCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  pre_block_channels: [24, 24]  # TDS Conv blocks before transformer (local features)
  block_channels: [24, 24, 24, 24]  # TDS Conv blocks after transformer
  kernel_width: 32
  spec_norm_type: RollingTimeNorm
  share_hand_weights: false
  use_transformer: false
  transformer_d_model: 256
  transformer_nhead: 8
  transformer_num_layers: 6
  transformer_dim_feedforward: 1024
  transformer_max_len: 5000
  transformer_chunk_size: 5000

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
