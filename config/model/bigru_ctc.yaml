# @package _global_
module:
  _target_: emg2qwerty.lightning.BiGRUCTCModule
  in_features: 528  # freq * channels = (n_fft // 2 + 1) * 16
  mlp_features: [384]
  block_channels: [24, 24, 24, 24]  # TDS Conv blocks before BiGRU
  kernel_width: 32
  hidden_size: 256
  num_layers: 2
  dropout: 0.1
  spec_norm_type: RollingTimeNorm

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
